                { sentence: "其喜【洋洋】者矣", word: "洋洋", options: ["得意、歡樂的樣子", "海洋", "大量", "漫無邊際"], answer: "得意、歡樂的樣子" },
                { sentence: "處江湖之【遠】", word: "遠", options: ["偏遠的地方（指朝廷以外）", "遠方", "長遠", "疏遠"], answer: "偏遠的地方（指朝廷以外）" },
                { sentence: "或異二者之【為】", word: "為", options: ["行為、心境（或心理活動）", "成為", "作為", "替"], answer: "行為、心境（或心理活動）" },
                { sentence: "【微】斯人", word: "微", options: ["如果沒有", "微小", "稍微", "卑微"], answer: "如果沒有" },
                { sentence: "吾誰【與】歸", word: "與", options: ["跟隨、同道", "給予", "和", "參與"], answer: "跟隨、同道" }
            ]
        };

        const shuffleArray = (array) => {
            return array.sort(() => Math.random() - 0.5);
        };

        function QuizComponent({ title, data, onBack }) {
            const [gameState, setGameState] = React.useState('start');
            const [questions, setQuestions] = React.useState([]);
            const [currentIndex, setCurrentIndex] = React.useState(0);
            const [score, setScore] = React.useState(0);
            const [wrongAnswers, setWrongAnswers] = React.useState([]);
            const [selectedOption, setSelectedOption] = React.useState(null);
            const [isChecking, setIsChecking] = React.useState(false);

            const startGame = () => {
                const shuffledQuestions = shuffleArray([...data]).map(q => ({
                    ...q,
                    shuffledOptions: shuffleArray([...q.options])
                }));
                setQuestions(shuffledQuestions);
                setCurrentIndex(0);
                setScore(0);
                setWrongAnswers([]);
                setGameState('playing');
                setSelectedOption(null);
                setIsChecking(false);
            };

            const handleOptionClick = (option) => {
                if (isChecking) return;
                
                setSelectedOption(option);
                setIsChecking(true);
                
                const currentQ = questions[currentIndex];
                const isCorrect = option === currentQ.answer;

                if (isCorrect) {
                    setScore(prev => prev + 1);
                } else {
                    setWrongAnswers(prev => [...prev, {
                        ...currentQ,
                        userAnswer: option
                    }]);
                }

                setTimeout(() => {
                    if (currentIndex < questions.length - 1) {
                        setCurrentIndex(prev => prev + 1);
                        setSelectedOption(null);
                        setIsChecking(false);
                    } else {
                        setGameState('result');
                    }
                }, 1200);
            };

            return (
                <div className="bg-[#fcfaf7] border-double border-[6px] border-[#8a7967] shadow-2xl max-w-2xl w-full mx-auto p-6 md:p-10 fade-in relative">
                    <button 
                        onClick={onBack}
                        className="absolute top-4 left-4 md:top-6 md:left-6 text-[#8a7967] hover:text-[#8c2121] transition"
                        title="返回首頁"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" className="h-7 w-7 md:h-8 md:w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                        </svg>
                    </button>

                    <div className="text-center mb-8 border-b-2 border-[#d9cebe] pb-4 mt-8 md:mt-0">
                        <h2 className="text-2xl md:text-3xl font-bold text-[#2b2623] tracking-widest">《{title}》註釋小測</h2>
                    </div>

                    {gameState === 'start' && (
                        <div className="text-center fade-in">
                            <p className="text-xl text-[#5c4f45] mb-8 tracking-wider">
                                本篇章錄有 <span className="font-bold text-[#8c2121] text-2xl mx-1">{data.length}</span> 題文言字詞。
                            </p>
                            <button 
                                onClick={startGame}
                                className="bg-[#8c2121] hover:bg-[#591111] text-[#f6f1e7] text-xl font-bold py-3 px-10 rounded-sm border-2 border-[#591111] shadow-lg transition duration-200 transform hover:scale-105 tracking-widest"
                            >
                                啟卷作答
                            </button>
                        </div>
                    )}

                    {gameState === 'playing' && questions.length > 0 && (
                        <div className="fade-in">
                            <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-1 mb-4 text-sm md:text-base font-bold text-[#8a7967] tracking-wider">
                                <span>卷次：{currentIndex + 1} / {questions.length}</span>
                                <span>積分：{score}</span>
                            </div>
                            
                            <div className="mb-8">
                                <h3 className="text-xl md:text-2xl text-[#2b2623] mb-4 font-medium tracking-wider mobile-question">
                                    請擇以下句中 <span className="text-[#8c2121] font-bold text-3xl">「{questions[currentIndex].word}」</span> 之正解：
                                </h3>
                                <div className="bg-[#f0e8d5] p-5 md:p-6 rounded-sm border-l-4 border-[#8c2121] text-2xl md:text-3xl text-[#2b2623] tracking-widest shadow-inner leading-relaxed mobile-sentence">
                                    {questions[currentIndex].sentence}
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {questions[currentIndex].shuffledOptions.map((option, index) => {
                                    let buttonClass = "w-full text-left p-4 rounded-sm border-2 transition duration-200 text-lg md:text-xl font-medium shadow-sm outline-none tracking-wider ";
                                    
                                    if (isChecking) {
                                        if (option === questions[currentIndex].answer) {
                                            buttonClass += "bg-[#e6f0e9] border-[#336542] text-[#1c3b25]"; 
                                        } else if (option === selectedOption) {
                                            buttonClass += "bg-[#fbeaea] border-[#8c2121] text-[#591111]"; 
                                        } else {
                                            buttonClass += "bg-[#fcfaf7] border-[#d9cebe] text-[#b0a595] opacity-60"; 
                                        }
                                    } else {
                                        buttonClass += "bg-[#fcfaf7] border-[#b0a595] hover:border-[#8c2121] text-[#2b2623] hover:bg-[#fcf4f4] hover:text-[#8c2121]";
                                    }

                                    return (
                                        <button 
                                            key={index}
                                            onClick={() => handleOptionClick(option)}
                                            disabled={isChecking}
                                            className={buttonClass}
                                        >
                                            {option}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    {gameState === 'result' && (
                        <div className="fade-in">
                            <div className="text-center mb-8">
                                <h2 className="text-3xl md:text-4xl font-bold text-[#8c2121] mb-2 tracking-widest">作答告竣</h2>
                                <p className="text-xl text-[#5c4f45] mt-4 tracking-wider">爾之得分： 
                                    <span className="text-4xl font-bold text-[#2b2623] ml-3">
                                        {score} / {questions.length}
                                    </span>
                                </p>
                                <p className="text-[#8a7967] mt-4 text-lg">
                                    {score === questions.length ? "博學強記，令人欽佩！" : "學如不及，猶恐失之，宜再行溫故。"}
                                </p>
                            </div>

                            {wrongAnswers.length > 0 && (
                                <div className="mb-8">
                                    <h3 className="text-xl md:text-2xl font-bold text-[#8c2121] mb-4 border-b-2 border-[#d9cebe] pb-2 tracking-wider">須重溫之字義：</h3>
                                    <ul className="space-y-4">
                                        {wrongAnswers.map((item, index) => (
                                            <li key={index} className="bg-[#f0e8d5] p-5 rounded-sm border border-[#d9cebe]">
                                                <p className="font-bold text-[#2b2623] mb-2 text-xl">
                                                    <span className="text-[#8c2121] text-2xl">「{item.word}」</span>
                                                </p>
                                                <p className="text-[#2b2623] mb-4 bg-[#fcfaf7] p-3 rounded-sm shadow-sm text-xl tracking-widest">{item.sentence}</p>
                                                <div className="flex flex-col sm:flex-row gap-3 text-base">
                                                    <span className="bg-[#fcfaf7] px-3 py-2 rounded-sm border border-[#8c2121] text-[#8c2121] line-through opacity-80">爾選：{item.userAnswer}</span>
                                                    <span className="bg-[#e6f0e9] px-3 py-2 rounded-sm border border-[#336542] text-[#1c3b25] font-bold">正解：{item.answer}</span>
                                                </div>
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            )}

                            <div className="text-center flex flex-col sm:flex-row justify-center gap-4 mt-8">
                                <button 
                                    onClick={startGame}
                                    className="bg-[#8c2121] hover:bg-[#591111] text-[#f6f1e7] font-bold py-3 px-8 rounded-sm shadow-md transition duration-200 tracking-widest text-lg"
                                >
                                    重新試練此卷
                                </button>
                                <button 
                                    onClick={onBack}
                                    className="bg-[#e8d5c4] hover:bg-[#d9cebe] text-[#591111] font-bold py-3 px-8 rounded-sm shadow-md transition duration-200 tracking-widest text-lg border border-[#c4bcaa]"
                                >
                                    返回揀選他卷
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function App() {
            const [selectedTextId, setSelectedTextId] = React.useState(null);

            const renderNavBar = () => (
                <nav className="bg-[#591111] text-[#f6f1e7] shadow-lg sticky top-0 z-50 border-b-[3px] border-[#c49c47]">
                    <div className="max-w-7xl mx-auto px-4">
                        <div className="flex items-center justify-between h-16">
                            <div className="flex-shrink-0 cursor-pointer flex items-center" onClick={() => setSelectedTextId(null)}>
                                <span className="font-bold text-2xl tracking-widest mobile-nav-title">📖 十二篇範文集</span>
                            </div>
                        </div>
                    </div>
                    <div className="bg-[#3f0b0b] overflow-x-auto nav-scrollbar border-b border-[#2a0606]">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex space-x-2 md:space-x-4">
                            {textsCatalog.map(text => (
                                <button
                                    key={text.id}
                                    onClick={() => setSelectedTextId(text.id)}
                                    className={`whitespace-nowrap px-4 py-2 rounded-sm text-base tracking-wider transition-colors border ${
                                        selectedTextId === text.id 
                                        ? 'bg-[#f6f1e7] text-[#591111] border-[#f6f1e7] font-bold shadow-inner' 
                                        : 'bg-transparent text-[#e8d5c4] border-[#8c2121] hover:bg-[#8c2121] hover:text-[#fcfaf7]'
                                    }`}
                                >
                                    {text.title}
                                </button>
                            ))}
                        </div>
                    </div>
                </nav>
            );

            const currentTextInfo = textsCatalog.find(t => t.id === selectedTextId);
            const currentQuizData = allQuizData[selectedTextId];

            return (
                <div className="min-h-screen flex flex-col">
                    {renderNavBar()}

                    <main className="flex-grow p-4 md:p-8 flex items-center justify-center">
                        {!selectedTextId ? (
                            <div className="text-center fade-in max-w-4xl w-full hero-paper">
                                <h1 className="text-4xl md:text-5xl font-bold text-[#2b2623] mb-6 tracking-[0.2em] relative inline-block mobile-title">
                                    十二篇範文註釋特訓
                                    <span className="absolute -top-4 -right-12 border-2 border-[#8c2121] text-[#8c2121] text-sm p-1 transform rotate-12 opacity-80 font-bold tracking-widest rounded-sm">
                                        必修
                                    </span>
                                </h1>
                                <p className="text-lg md:text-xl text-[#5c4f45] mb-8 md:mb-12 leading-relaxed tracking-widest max-w-2xl mx-auto mobile-copy">
                                    語譯乃文憑試中文科取分之基石。<br/>請於下方揀選篇章，反覆試練，以求熟記於心。
                                </p>
                                
                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-5 text-left">
                                    {textsCatalog.map(text => {
                                        const hasData = allQuizData[text.id] && allQuizData[text.id].length > 0;
                                        return (
                                            <div 
                                                key={`card-${text.id}`}
                                                onClick={() => setSelectedTextId(text.id)}
                                                className={`text-card p-5 rounded-sm border-2 cursor-pointer transition transform relative overflow-hidden ${
                                                    hasData 
                                                    ? 'bg-[#fcfaf7] border-[#d9cebe] hover:border-[#8c2121] hover:-translate-y-1 hover:shadow-xl' 
                                                    : 'text-card--pending bg-[#ebe5d9] border-[#c4bcaa] opacity-70 hover:opacity-100'
                                                }`}
                                            >
                                                <h3 className="font-bold text-[#2b2623] text-lg mb-2 pl-2 tracking-wider mobile-card-title">{text.title}</h3>
                                                <p className="text-sm text-[#8a7967] mb-4 pl-2 tracking-widest">{text.author}</p>
                                                <div className="pl-2">
                                                    {hasData ? (
                                                        <span className="inline-block bg-[#8c2121] text-[#f6f1e7] text-xs px-2 py-1 rounded-sm tracking-wider">可作答</span>
                                                    ) : (
                                                        <span className="inline-block bg-[#a39c90] text-[#fcfaf7] text-xs px-2 py-1 rounded-sm tracking-wider">籌備中</span>
                                                    )}
                                                </div>
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                        ) : (
                            <div className="w-full">
                                {currentQuizData && currentQuizData.length > 0 ? (
                                    <QuizComponent 
                                        key={selectedTextId} 
                                        title={currentTextInfo.title} 
                                        data={currentQuizData} 
                                        onBack={() => setSelectedTextId(null)}
                                    />
                                ) : (
                                    <div className="bg-[#fcfaf7] border-double border-[6px] border-[#8a7967] shadow-xl max-w-lg w-full mx-auto p-10 text-center fade-in">
                                        <div className="text-5xl mb-6 opacity-60">📜</div>
                                        <h2 className="text-3xl font-bold text-[#2b2623] mb-4 tracking-widest">《{currentTextInfo.title}》</h2>
                                        <p className="text-[#8a7967] mb-8 text-lg tracking-wider">此卷尚在編纂之中，敬請靜候佳音。</p>
                                        <button 
                                            onClick={() => setSelectedTextId(null)}
                                            className="bg-[#8c2121] hover:bg-[#591111] text-[#f6f1e7] font-bold py-2 px-8 rounded-sm shadow transition tracking-widest"
                                        >
                                            返回首頁
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                    
                    <footer className="py-6 text-center text-[#8a7967] text-sm tracking-widest">
                        &copy; 2026 DSE 中文溫習小測 | 借古鑑今 · 金榜題名
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
